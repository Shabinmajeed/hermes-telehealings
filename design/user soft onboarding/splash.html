<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telehealings</title>
  <style>
    /* ==========================================================================
       DESIGN TOKENS (Variables)
       ========================================================================== */
    :root {
      --color-page-bg: #f0f2f5;
      --color-surface: #ffffff;
      --color-primary: #387bd5;
      --color-primary-600: #3b82f6;
      --color-header-title: #FFFFFF;
      --color-header-subtitle: #E0F2FE;
      --color-text: #111827;
      --color-muted: #6b7280;
      --color-border: #d1d5db;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-size-base: 16px;
      --h1-size: 24px;
      --h2-size: 20px;
      --h3-size: 16px;
      --p-size: 15px;
      --small-size: 13px;

      --space-xs: 0.5vh;
      --space-s: 1vh;
      --space-m: 1.5vh;
      --space-l: 2vh;
      --space-xl: 2.5vh;
      --space-xxl: 3vh;

      --radius: 12px;
      --pill-radius: 30px;
      --app-max-width: 380px;
      --app-max-height: 760px;

      --shadow-1: 0 6px 16px rgba(0,0,0,0.04);
      --shadow-2: 0 10px 25px rgba(0,0,0,0.1);
    }

    /* ==========================================================================
       GLOBAL RESET & BOX SIZING
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    input, textarea, select {
      font-size: max(16px, 1em);
    }
    
    a, button, input, select, textarea {
      touch-action: manipulation;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--font-size-base);
      color: var(--color-text);
      background-color: var(--color-page-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 { font-size: var(--h1-size); font-weight: 700; line-height: 1.2; }
    h2 { font-size: var(--h2-size); font-weight: 600; line-height: 1.25; }
    h3 { font-size: var(--h3-size); font-weight: 600; line-height: 1.3; }
    p { font-size: var(--p-size); font-weight: 400; line-height: 1.5; color: var(--color-text); }
    small, .text-small { font-size: var(--small-size); color: var(--color-muted); }

    /* ==========================================================================
       MOBILE APP CONTAINER
       ========================================================================== */
    .mobile-app-container {
      height: 100vh;
      max-height: 900px;
      aspect-ratio: 375 / 800;
      max-width: 100%;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-2);
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    @media (max-width: 380px) {
      .mobile-app-container {
        width: 100%;
        aspect-ratio: auto;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    /* ==========================================================================
       BUTTONS
       ========================================================================== */
    .btn-circle {
      background-color: var(--color-primary);
      color: #ffffff;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 123, 213, 0.18);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-circle:active { transform: scale(0.95); }

    .btn-primary {
      background: var(--color-primary);
      color: #ffffff;
      margin: 0 auto;
      width: 80%;
      height: 56px;
      margin-bottom: 15px;
      border-radius: var(--pill-radius);
      border: none;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.18);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
    }

    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.12);
    }

    .btn-outline {
      background: transparent;
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
    }

    /* ==========================================================================
       SPLASH SCREEN STYLES
       ========================================================================== */
    .splash-container {
      /* Subtle radial gradient for premium illumination effect */
      background: radial-gradient(circle at center, #5b96ea 0%, #387bd5 70%);
      border: none; /* Clean edge for the splash screen */
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer; /* Added for temporary click functionality */
    }

    .splash-container.fade-out {
      opacity: 0;
    }

    .splash-screen {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      position: relative;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: brandFadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .splash-logo-circle {
      background-color: #ffffff;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      margin-top: -60px; /* Slight visual adjustment to pull it up */
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }

    @keyframes brandFadeIn {
      from {
        opacity: 0;
        transform: scale(0.98) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .splash-logo-circle img {
      width: 100px;
      height: auto;
    }

    .splash-title {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 36px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.01em;
    }

    .splash-subtitle {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      opacity: 0.85;
      color: #e2effb;
    }
  </style>
</head>
<body>

  <!-- The simulated mobile screen -->
  <div class="mobile-app-container splash-container">
    
    <!-- Splash Screen Full Cover -->
    <div class="splash-screen">
      <div class="brand-block">
        <div class="splash-logo-circle">
          <!-- Path updated for new folder location -->
          <img src="../src/logo.png" alt="Telehealings Logo">
        </div>
        <h1 class="splash-title">Telehealings</h1>
        <p class="splash-subtitle">Continuity-First Wellness Care Platform</p>
      </div>
    </div>

  </div>

  <script>
    // --- CLICK TO CONTINUE (Temporary) ---
    document.querySelector('.splash-container').addEventListener('click', () => {
      document.querySelector('.splash-container').classList.add('fade-out');
      setTimeout(() => {
        // Note: the link path is updated relative to this new folder
        window.location.href = '../workflows/soft-onboarding/marketing.html';
      }, 600);
    });
  </script>
</body>
</html>
