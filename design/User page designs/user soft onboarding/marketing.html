<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telehealings - Marketing</title>
  <style>
    /* ==========================================================================
       DESIGN TOKENS (Variables)
       ========================================================================== */
    :root {
      --color-page-bg: #f0f2f5;
      --color-surface: #ffffff;
      --color-primary: #387bd5;
      --color-primary-600: #3b82f6;
      --color-text: #111827;
      --color-muted: #6b7280;
      --color-border: #d1d5db;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-size-base: 16px;

      --space-xs: 0.5vh;
      --space-s: 1vh;
      --space-m: 1.5vh;
      --space-l: 2vh;
      --space-xl: 2.5vh;
      --space-xxl: 3vh;

      --radius: 12px;
      --shadow-1: 0 6px 16px rgba(0,0,0,0.04);
      --shadow-2: 0 10px 25px rgba(0,0,0,0.1);
    }

    /* ==========================================================================
       GLOBAL RESET & BOX SIZING
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--font-size-base);
      color: var(--color-text);
      background-color: var(--color-page-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ==========================================================================
       MOBILE APP CONTAINER
       ========================================================================== */
    .mobile-app-container {
      height: 100vh;
      max-height: 900px;
      aspect-ratio: 375 / 800;
      max-width: 100%;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-2);
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    @media (max-width: 380px) {
      .mobile-app-container {
        width: 100%;
        aspect-ratio: auto;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    /* ==========================================================================
       BUTTONS
       ========================================================================== */
    .btn-circle {
      background-color: var(--color-primary);
      color: #ffffff;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 123, 213, 0.18);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-circle:active {
      transform: scale(0.95);
    }

    /* ==========================================================================
       LAYOUT COMPONENTS
       ========================================================================== */
    .top-section {
      background: linear-gradient(180deg, rgba(59,130,246,0.12) 0%, rgba(226,239,250,1) 100%);
      border-radius: 0 0 50% 50% / 0 0 25px 25px;
      padding: 48px var(--space-l) calc(var(--space-xl) + 5px) var(--space-l);
      z-index: 20;
      flex-shrink: 0;
      position: relative;
      box-shadow: var(--shadow-1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ==========================================================================
       MARKETING SCREEN SPECIFIC STYLES
       ========================================================================== */
    @keyframes slideFadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .marketing-container {
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .marketing-logo-box {
      margin-bottom: 10px;
    }

    .marketing-logo-box img {
      width: 120px;
      height: auto;
    }

    .marketing-title {
      color: #1e5ab8;
      font-size: 34px;
      font-weight: 700;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
      opacity: 0;
      animation: slideFadeUp 0.6s ease-out 0.1s forwards;
    }

    .marketing-subtitle {
      color: #1e5ab8;
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 35px 0;
      text-align: center;
      opacity: 0;
      animation: slideFadeUp 0.6s ease-out 0.2s forwards;
    }

    .features-list {
      position: relative;
      margin-bottom: 40px;
      width: 100%;
      max-width: 300px;
      opacity: 0;
      animation: slideFadeUp 0.6s ease-out 0.3s forwards;
    }

    .feature-item {
      color: #1e5ab8;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 9px;
      position: relative;
      padding-left: 24px;
    }

    .feature-item:last-child {
      margin-bottom: 0;
    }

    .feature-item::before {
      content: '✦';
      position: absolute;
      left: 0;
      top: -1px;
      color: #1e5ab8;
      font-size: 16px;
    }

    .stats-row {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: space-between;
      max-width: 340px;
      opacity: 0;
      animation: slideFadeUp 0.6s ease-out 0.4s forwards;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      padding: 20px 12px;
      flex: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .stat-box-value {
      color: #1e5ab8;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .stat-box-label {
      color: #55605E;
      font-size: 0.65rem;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.05em;
    }

    .bottom-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 25px 60px 25px;
      background-color: #ffffff;
      opacity: 0;
      animation: slideFadeUp 0.6s ease-out 0.5s forwards;
    }

    .heali-img {
      width: 90px;
      margin-top: auto;
      margin-bottom: 10px;
      animation: float 4s ease-in-out infinite;
    }

    .cta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: auto;
    }

    .cta-text {
      color: #1e5ab8;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.5px;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="mobile-app-container marketing-container">
    
    <!-- Top Gradient Area -->
    <div class="top-section">
      <div class="marketing-logo-box">
        <img src="../src/logo.png" alt="Telehealings Logo">
      </div>
      
      <h1 class="marketing-title">Telehealings</h1>
      <h2 class="marketing-subtitle">Continuity-first wellness care platform</h2>
      
      <div class="features-list">
        <div class="feature-item">Ai-powered conversational partner</div>
        <div class="feature-item">Therapist handover continuity</div>
        <div class="feature-item">Self-help library</div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <span class="stat-box-value">200+</span>
          <span class="stat-box-label">Verified<br>therapists</span>
        </div>
        <div class="stat-box">
          <span class="stat-box-value">8+</span>
          <span class="stat-box-label">Languages<br>&nbsp;</span>
        </div>
        <div class="stat-box">
          <span class="stat-box-value">1,000+</span>
          <span class="stat-box-label">Hours of<br>therapy</span>
        </div>
      </div>
    </div>

    <!-- Bottom White Area with Heali -->
    <div class="bottom-section">
      <img src="../src/Heali.png" alt="Heali the Penguin" class="heali-img">
      
      <div class="cta-row">
        <p class="cta-text">Your wellness journey<br>is one click away.</p>
        <button class="btn-circle" onclick="window.location.href='./soft-onboarding.html'"> 
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </div>

  </div>

</body>
</html>
