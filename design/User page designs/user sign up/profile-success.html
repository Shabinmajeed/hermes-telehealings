<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telehealings - Profile Success</title>
  <style>
    /* ==========================================================================
       DESIGN TOKENS & BASE STYLES
       ========================================================================== */
    :root {
      --color-page-bg: #f0f2f5;
      --color-surface: #ffffff;
      --color-primary: #387bd5;
      --color-primary-600: #3b82f6;
      --color-text: #111827;
      --color-muted: #6b7280;
      --color-border: #d1d5db;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-size-base: 16px;
      --radius: 12px;
      --pill-radius: 30px;
      --shadow-2: 0 10px 25px rgba(0,0,0,0.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    input, textarea, select { font-size: max(16px, 1em); }
    a, button, input, select, textarea { touch-action: manipulation; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: var(--font-sans); font-size: var(--font-size-base); color: var(--color-text); background-color: var(--color-page-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    .mobile-app-container {
      height: 100vh; max-height: 900px; aspect-ratio: 375 / 800; max-width: 100%;
      background-color: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius);
      box-shadow: var(--shadow-2); display: flex; flex-direction: column; overflow: hidden; position: relative;
    }
    @media (max-width: 380px) {
      .mobile-app-container { width: 100%; aspect-ratio: auto; border-radius: 0; border: none; box-shadow: none; }
    }

    .btn-primary {
      background: var(--color-primary); color: #ffffff; width: 100%; height: 56px; border-radius: var(--pill-radius); border: none;
      font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.18); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
    }
    .btn-primary:active { transform: scale(0.97); box-shadow: 0 4px 10px rgba(59, 130, 246, 0.12); }

    /* ==========================================================================
       FORM & PAGE SPECIFIC
       ========================================================================== */
    @keyframes slideFadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      40% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-container {
      background-color: #ffffff;
    }

    .content-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 24px;
      text-align: center;
    }

    .icon-wrapper {
      width: 100px;
      height: 100px;
      background: #f0fdfa; /* Soft teal background */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      color: #0d9488;
      box-shadow: 0 12px 35px rgba(13, 148, 136, 0.15);
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      color: #335075;
      margin: 0 0 16px 0;
      letter-spacing: -0.5px;
      animation: slideFadeUp 0.5s ease-out 0.2s forwards;
      opacity: 0;
    }

    .subtitle {
      font-size: 15px;
      font-weight: 500;
      color: #637b96;
      line-height: 1.6;
      margin: 0;
      animation: slideFadeUp 0.5s ease-out 0.3s forwards;
      opacity: 0;
    }

    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      margin-top: 24px;
      animation: slideFadeUp 0.5s ease-out 0.4s forwards;
      opacity: 0;
    }

    .bottom-actions {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideFadeUp 0.5s ease-out 0.5s forwards;
      opacity: 0;
    }

    .btn-secondary {
      width: 100%;
      height: 56px;
      border-radius: 30px;
      border: 2px solid #e2e8f0;
      background: #ffffff;
      color: #475569;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:active {
      background: #f8fafc;
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="mobile-app-container success-container">
    
    <div class="content-section">
      <div class="icon-wrapper">
        <!-- Shield Check Icon -->
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <polyline points="9 12 11 14 15 10"></polyline>
        </svg>
      </div>
      
      <h1 class="title">Profile Updated Successfully!</h1>
      
      <p class="subtitle">
        Your personal details have been saved securely. We value your privacy and guarantee that your information will never be shared with third parties.
      </p>

      <div class="secure-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        End-to-End Encrypted
      </div>
    </div>

    <div class="bottom-actions">
      <!-- Takes the user to the next stage -->
      <button class="btn-primary" onclick="window.location.href='../workflows/medical-profile/medical-profile-1.html'">
        Complete Medical Profile
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
      
      <!-- Takes the user to the Home Page -->
      <button class="btn-secondary" onclick="window.location.href='./home.html'">
        Go to Home
      </button>
    </div>

  </div>
</body>
</html>
